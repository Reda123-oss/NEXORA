[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "0.1.0"
description = "A PyTorch framework for building Transformer language models"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "numpy",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]